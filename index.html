<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segunda Vida · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --surface:#FFFDF8; --surface-2:#EFE8DA; --ink:#1F2A24; --ink-2:#4E5A52; --muted:#6B746D;
  --line:#E2D9C7; --moss:#2F5D45; --moss-2:#E2ECE3; --accent:#C8562E; --accent-ink:#fff; --accent-soft:#F7E2D7;
  --sand:#E9DCC3; --sun:#E8B04B; --sky:#BFD6D9; --rose:#E9B9A6;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(31,42,36,.06),0 8px 24px rgba(31,42,36,.07);
  --font:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--moss)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:650;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,6vw,3.2rem)} h2{font-size:clamp(1.4rem,4.2vw,2rem)} h3{font-size:1.15rem}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,240,230,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:62px}
.logo{white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:650;font-size:1.2rem;background:none;border:0;padding:4px}
.logo-mark{width:30px;height:30px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:none;align-items:center;justify-content:center}
.back.show{display:flex}
.deskNav{display:none;gap:2px;margin-left:12px}
.deskNav button{white-space:nowrap;background:none;border:0;padding:8px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:.94rem}
.deskNav button:hover{background:var(--surface-2)}
.deskNav button.on{color:var(--ink);background:var(--surface-2)}
.spacer{flex:1}
.pill-demo{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sand);color:#5b4a2c;padding:4px 8px;border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:600;min-height:46px;transition:transform .15s ease,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn>svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(200,86,46,.28)}
.btn-primary:hover{background:#b44a25}
.btn-dark{background:var(--moss);color:#fff}
.btn-dark:hover{background:#244a37}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{min-height:38px;padding:8px 13px;border-radius:11px;font-size:.9rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.surprise-top{display:none}

/* Tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--moss)}
.tabbar .tab-create span.ic{background:var(--accent);color:#fff;width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 6px 16px rgba(200,86,46,.35)}
.tabbar .tab-create.on{color:var(--accent)}

@media (min-width:900px){
  body{padding-bottom:0}
  .tabbar{display:none}
  .deskNav{display:flex}
  .surprise-top{display:inline-flex}
  .deskNav .xl{display:none}
}
@media (min-width:1220px){.deskNav .xl{display:inline-block}}

/* View */
main{min-height:70vh}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:26px 0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--ink-2);font-size:1.06rem;max-width:58ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:620px){.grid.g2,.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--moss-2);color:#1d3b2b;border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem}
.notice svg{flex:none;margin-top:2px}
.notice.warm{background:var(--accent-soft);color:#6b2a12}

/* Hero */
.hero{padding:28px 0 8px}
.hero-grid{display:grid;gap:22px;align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:1.1fr .9fr;gap:40px}.hero{padding:56px 0 20px}}
.hero h1 em{font-style:italic;color:var(--moss)}
.hero-art{border-radius:28px;overflow:hidden;background:var(--sand);aspect-ratio:5/4;position:relative}
.hero-art svg{width:100%;height:100%;display:block}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:.9rem;font-weight:500;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:#cbbfa6}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
.chip.ex{background:var(--surface)}
.chip.ex:hover{background:var(--accent-soft);border-color:var(--accent)}

.steps3{display:grid;gap:12px}
@media(min-width:760px){.steps3{grid-template-columns:repeat(3,1fr)}}
.step3 .num{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:10px}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:760px){.cats{grid-template-columns:repeat(8,1fr)}}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:600;transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-2px);border-color:#cbbfa6}
.cat.on{border-color:var(--moss);background:var(--moss-2)}
.cat svg{width:34px;height:34px}

/* Project cards */
.pcard{overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(31,42,36,.06),0 16px 32px rgba(31,42,36,.1)}
.pcard .thumb{position:relative;aspect-ratio:16/10;background:var(--sand);border:0;padding:0;display:block;width:100%}
.pcard .thumb svg{width:100%;height:100%;display:block}
.pcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h3{font-size:1.12rem}
.pcard .open{background:none;border:0;padding:0;text-align:left}
.fav{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,253,248,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .2s}
.fav:active{transform:scale(.85)}
.fav svg{width:20px;height:20px}
.fav.on svg path{fill:var(--accent);stroke:var(--accent)}
.fav.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.badge.extra{background:var(--accent-soft);color:#8a3415}
.badge.ok{background:var(--moss-2);color:#1d4a32}
.badge.prem{background:#2a2a24;color:#f2d38a}
.badge.done{background:var(--moss);color:#fff}
.tagline{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.lockveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,42,36,.05),rgba(31,42,36,.55));display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:600;font-size:.88rem;gap:6px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reason{font-size:.75rem;color:var(--moss);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.meta{display:flex;gap:12px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:4px}

/* Filters */
.filters{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.frow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow .lab{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:none;width:76px}
.frow .chip{flex:none;min-height:36px;padding:6px 12px;font-size:.86rem}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}

/* Form */
.form{display:grid;gap:18px}
.field label.lbl,.field .lbl{display:block;font-weight:600;margin-bottom:8px}
.field .hint{font-size:.84rem;color:var(--muted);margin-top:6px}
.input,.select{width:100%;min-height:50px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 4px rgba(47,93,69,.14)}
.input.err{border-color:var(--accent);box-shadow:0 0 0 4px rgba(200,86,46,.14)}
.errmsg{color:#a43e1b;font-size:.86rem;margin-top:6px;font-weight:500}
.two{display:grid;gap:18px}
@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);width:max-content}
.stepper button{width:48px;height:48px;border:0;background:none;font-size:1.3rem;font-weight:600}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:600;font-size:.88rem;min-height:44px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks .chip svg{width:16px;height:16px}
.formwrap{display:grid;gap:22px}
@media(min-width:900px){.formwrap{grid-template-columns:1.4fr .8fr;align-items:start}.formside{position:sticky;top:84px}}

/* Loader */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;min-height:55vh}
.spin{width:64px;height:64px}
.spin circle{transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail */
.detail-grid{display:grid;gap:22px}
@media(min-width:900px){.detail-grid{grid-template-columns:1fr 1fr;align-items:start}.detail-aside{position:sticky;top:84px}}
.detail-art{border-radius:24px;overflow:hidden;aspect-ratio:16/11;background:var(--sand);position:relative}
.detail-art svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.fact b{display:block;font-size:1rem}
.fact span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.mlist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.mlist li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.94rem}
.mlist li .dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.mlist li.have .dot{background:var(--moss-2);color:var(--moss)}
.mlist li.need{border-color:#efc6b3;background:#fff7f2}
.mlist li.need .dot{background:var(--accent-soft);color:var(--accent)}
.mlist li .tag{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--muted)}
.mlist li.need .tag{color:#a43e1b}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:background .2s,opacity .2s}
.steps li.ok{background:var(--moss-2);border-color:#c7dacb}
.steps li.ok p{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(47,93,69,.4)}
.check{width:30px;height:30px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:all .2s}
.steps li.ok .check{background:var(--moss);border-color:var(--moss);color:#fff}
.steps .sn{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),#5b8f6f);border-radius:99px;transition:width .4s ease}
.actionbar{display:flex;gap:10px;flex-wrap:wrap}
.actionbar .btn{flex:1;min-width:150px}
.qtybox{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:.92rem}

/* Empty */
.empty{text-align:center;padding:40px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:120px;height:120px}

/* Profile */
.avatar{width:64px;height:64px;border-radius:20px;background:var(--moss);color:#fff;font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem}
.stat span{font-size:.78rem;color:var(--muted)}
.menu{display:grid;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;min-height:56px}
.menu button:hover{background:var(--surface-2)}
.menu button .chev{margin-left:auto;color:var(--muted)}

/* Impact */
.big{font-family:var(--display);font-size:clamp(2rem,7vw,3rem);font-weight:650;line-height:1}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:88px 1fr 64px;align-items:center;gap:10px;font-size:.88rem}
.bar .tr{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--moss);transition:width .6s ease}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* Premium */
.plans{display:grid;gap:16px}
@media(min-width:760px){.plans{grid-template-columns:1fr 1fr}}
.plan{padding:22px;display:flex;flex-direction:column;gap:14px}
.plan.pro{background:#22302A;color:#F5F0E6;border-color:#22302A}
.plan.pro .muted{color:#b9c2bb}
.price{font-family:var(--display);font-size:2.2rem;font-weight:650}
.price small{font-family:var(--font);font-size:.9rem;font-weight:500;opacity:.75}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.feat li{display:flex;gap:9px;align-items:flex-start;font-size:.94rem}
.feat li svg{flex:none;margin-top:3px}
.feat li.no{opacity:.55}

/* Toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:500;font-size:.92rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--sun);font-weight:700;padding:4px}
@media(min-width:900px){.toast{bottom:28px}}

/* Modal */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(20,28,24,.45);padding:0}
.modal.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));text-align:center;position:relative;overflow:hidden;animation:up .35s cubic-bezier(.2,.9,.3,1.2)}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
.medal{width:96px;height:96px;margin:0 auto 10px}
.shuffle{animation:shuffle .7s ease}
@keyframes shuffle{0%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(0)}}

.footer{padding:30px 0 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);margin-top:30px}
.linkbtn{background:none;border:0;color:var(--moss);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <button class="back" id="backBtn" data-action="back" aria-label="Volver atrás">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="logo" data-go="inicio" aria-label="Segunda Vida, ir al inicio">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#2F5D45"/><path d="M9 21c0-6 5-11 14-11-1 8-6 12-12 12" fill="#E2ECE3"/><path d="M9 23c3-4 6-7 10-9" stroke="#2F5D45" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="23" cy="22" r="3" fill="#C8562E"/></svg>
      Segunda Vida
    </button>
    <nav class="deskNav" aria-label="Principal">
      <button data-go="inicio">Inicio</button>
      <button data-go="explorar">Explorar</button>
      <button data-go="crear">Crear</button>
      <button data-go="guardados">Guardados</button>
      <button class="xl" data-go="impacto">Impacto</button>
      <button class="xl" data-go="como-funciona">Cómo funciona</button>
      <button class="xl" data-go="premium">Premium</button>
      <button data-go="perfil">Perfil</button>
    </nav>
    <span class="spacer"></span>

let S;

let route = 'inicio', stack = [];
const app = document.getElementById('app');

/* ================= UTILIDADES ================= */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function fmtMin(m){return m<60?`${m} min`:(m%60?`${Math.floor(m/60)} h ${m%60} min`:`${m/60} h`)}
function fmtKg(g){return g>=1000?`${(g/1000).toLocaleString('es-ES',{maximumFractionDigits:1})} kg`:`${g} g`}
function styleName(k){return (STYLES.find(s=>s.k===k)||{}).n||k}
function detectMaterial(text){
  const t = norm(text); let best=null, bl=0;
  for(const m of MATERIALS) for(const kw of m.kw){ if(t.includes(kw) && kw.length>bl){best=m.k;bl=kw.length;} }
  return best;
}
function locked(p){return p.premium && !S.premium}
function extrasMissing(p,kit){return p.m.filter(x=>!x.obj && (x.extra || (x.k && !kit.includes(x.k))))}

/* ================= MOTOR DE COINCIDENCIAS (simulado, por reglas) ================= */
function match(q){
  const mat = q.material==='auto' ? detectMaterial(q.obj) : q.material;
  const t = norm(q.obj);
  const list = [];
  for(const p of P){
    const kwHit = p.kw.some(k=>t.includes(norm(k)));
    if(!(mat ? p.mat===mat : kwHit)) continue;
    let score = 0; const reasons=[];
    if(kwHit){score+=4;}
    if(p.style===q.style){score+=3;reasons.push('Tu estilo');}
    if(p.style===S.profile.style && p.style!==q.style) score+=1;
    if(p.min<=q.time){score+=2;reasons.push('Cabe en tu tiempo');}
    const miss = extrasMissing(p,q.kit).length; score -= miss*0.6;
    if(miss===0) reasons.push('Tienes todo');
    if(q.qty>=p.needs){score+=1;}
    if(locked(p)) score-=1.5;
    list.push({p,score,reasons});
  }
  list.sort((a,b)=>b.score-a.score);
  return {mat,list};
}

/* ================= ROUTER ================= */
const TABS = ['inicio','explorar','crear','guardados','perfil'];
function go(r,opts={}){
  if(r===route && !opts.force){render();return;}
  if(!opts.replace) stack.push(route);
  route=r;
  try{ history.replaceState(null,'','#'+r); }catch(e){}
  render(); window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}
function back(){
  const prev = stack.pop();
  route = prev || 'inicio';
  try{ history.replaceState(null,'','#'+route); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==route){stack.push(route);route=h;render();}});

function render(){
  let html='';
  if(route.startsWith('proyecto-')){ const p=BY[route.slice(9)]; html = p?viewDetail(p):viewNotFound(); }
  else switch(route){
    case 'inicio': html=viewHome();break;
    case 'crear': html=viewCreate();break;
    case 'cargando': html=viewLoading();break;
    case 'resultados': html=viewResults();break;
    case 'explorar': html=viewExplore();break;
    case 'guardados': html=viewSaved();break;
    case 'perfil': html=viewProfile();break;
    case 'impacto': html=viewImpact();break;
    case 'premium': html=viewPremium();break;
    case 'como-funciona': html=viewHow();break;
    default: html=viewNotFound();
  }
  app.innerHTML = `<div class="view">${html}</div>${footer()}`;
  document.getElementById('backBtn').classList.toggle('show', route!=='inicio');
  const tabKey = route.startsWith('proyecto-')||route==='resultados'||route==='cargando' ? (route==='resultados'||route==='cargando'?'crear':null) : route;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tabKey));
  document.querySelectorAll('.deskNav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tabKey));
  document.title = 'Segunda Vida · ' + ({inicio:'Inicio',crear:'Crear',resultados:'Ideas',explorar:'Explorar',guardados:'Guardados',perfil:'Perfil',impacto:'Impacto',premium:'Planes','como-funciona':'Cómo funciona'}[route] || (route.startsWith('proyecto-')?BY[route.slice(9)]?.t:'Demo'));
  if(route==='explorar'){ const i=document.getElementById('searchInput'); if(i && S._focusSearch){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); S._focusSearch=false; } }
}

function footer(){
  return `<footer class="footer"><div class="row" style="justify-content:space-between"><span>Segunda Vida · prototipo de demostración con datos de ejemplo.</span><span class="row"><button class="linkbtn" data-go="como-funciona">Cómo funciona</button><button class="linkbtn" data-go="impacto">Impacto</button><button class="linkbtn" data-go="premium">Planes</button></span></div></footer>`;
}

function card(p,extra){
  const fav = S.favs.includes(p.id), done=S.done.includes(p.id), lk=locked(p);
  const missing = extrasMissing(p, S.query?S.query.kit:S.profile.kit);
  const needsExtra = p.m.some(x=>x.extra);
  return `<article class="card pcard">
    <div style="position:relative">
      <button class="thumb" data-open="${p.id}" aria-label="Ver ${esc(p.t)}">${artFor(p)}${lk?`<span class="lockveil">${I.lock} Idea Premium</span>`:''}</button>
      <span class="tagline">${p.premium?`<span class="badge prem">${I.crown} Premium</span>`:''}${done?`<span class="badge done">${I.check} Hecho</span>`:''}</span>
      <button class="fav ${fav?'on':''}" data-fav="${p.id}" aria-pressed="${fav}" aria-label="${fav?'Quitar de':'Guardar en'} favoritos">${I.heart}</button>
    </div>
    <div class="body">
      <div class="badges"><span class="badge">${MATN[p.mat]}</span><span class="badge">${styleName(p.style)}</span><span class="badge">${p.use}</span></div>
      <button class="open" data-open="${p.id}"><h3>${esc(p.t)}</h3></button>
      <p class="muted small">${esc(p.d)}</p>
      <div class="meta"><span>${I.clock} ${fmtMin(p.min)}</span><span>${I.level} ${p.diff}</span></div>
      ${needsExtra?`<div><span class="badge extra">${I.plus} Necesita materiales extra${missing.length?` · ${missing.length}`:''}</span></div>`:`<div><span class="badge ok">${I.check} Sin compras extra</span></div>`}
      ${extra||''}
    </div>
  </article>`;
}
function filterBar(scope){
  const f = S[scope];
  const row=(lab,key,opts)=>`<div class="frow" role="group" aria-label="Filtrar por ${lab.toLowerCase()}"><span class="lab">${lab}</span><button class="chip ${!f[key]?'on':''}" data-filter="${scope}" data-key="${key}" data-val="">Todos</button>${opts.map(o=>`<button class="chip ${f[key]===o.k?'on':''}" data-filter="${scope}" data-key="${key}" data-val="${o.k}" aria-pressed="${f[key]===o.k}">${o.n}</button>`).join('')}</div>`;
  return `<div class="filters">
    ${row('Estilo','style',STYLES)}
    ${row('Dificultad','diff',DIFFS.map(d=>({k:d,n:d})))}
    ${row('Tiempo','time',TIME_FILTERS)}
    ${row('Uso','use',USES.map(u=>({k:u,n:u})))}
  </div>`;
}
function applyFilters(items,f){
  return items.filter(p=>(!f.style||p.style===f.style)&&(!f.diff||p.diff===f.diff)&&(!f.use||p.use===f.use)&&(!f.time||TIME_FILTERS.find(t=>t.k===f.time).t(p.min)));
}
function activeCount(f){return Object.values(f).filter(Boolean).length}
function emptyArt(){return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#EFE8DA"/><rect x="40" y="34" width="40" height="10" rx="3" fill="#c9bea6"/><rect x="36" y="44" width="48" height="50" rx="12" fill="#fff" stroke="#c9bea6" stroke-width="3"/><path d="M50 70c6-8 14-8 20 0" stroke="#2F5D45" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60 70v-14" stroke="#2F5D45" stroke-width="3" stroke-linecap="round"/><path d="M60 58c-4-6-10-6-12-6 1 5 6 8 12 6zM60 58c4-6 10-7 12-7-1 5-6 9-12 7z" fill="#5f9a6c"/></svg>`}

function viewCreate(){
  const f=S.form;
  const style=f.style||S.profile.style, time=f.time||S.profile.time, kit=f.kit||S.profile.kit;
  const det = f.material==='auto' ? detectMaterial(f.obj) : null;
  return `<section>
  <p class="eyebrow">Nuevo proyecto</p>
  <h1 style="margin:8px 0 6px;font-size:clamp(1.7rem,5vw,2.4rem)">¿Qué quieres reutilizar?</h1>
  <p class="lead">Cuanto más nos cuentes, mejor encajarán las ideas.</p>
  <div class="formwrap" style="margin-top:20px">
  <form class="form card pad" id="createForm" novalidate>
    <div class="field">
      <label class="lbl" for="obj">Objeto</label>
      <input class="input" id="obj" name="obj" list="objList" autocomplete="off" placeholder="Ej.: tarro de cristal, caja de cartón…" value="${esc(f.obj)}" aria-describedby="objHint objErr">
      <datalist id="objList">${['Tarro de cristal','Botella de vino','Caja de cartón','Caja de zapatos','Camiseta vieja','Pantalón vaquero','Botella de plástico','Latas de conserva','Caja de fruta','Revistas','Tapones de corcho'].map(o=>`<option value="${o}">`).join('')}</datalist>
      <p class="hint" id="objHint">${det?`Material detectado: <b>${MATN[det]}</b>`:'Escribe el objeto y detectaremos el material, o elígelo abajo.'}</p>
      <p class="errmsg" id="objErr" hidden>Escribe qué objeto tienes para poder proponerte ideas.</p>
    </div>
    <div class="two">
      <div class="field">
        <label class="lbl" for="material">Material</label>
        <select class="select" id="material" name="material">
          <option value="auto" ${f.material==='auto'?'selected':''}>Detectar automáticamente</option>
          ${MATERIALS.map(m=>`<option value="${m.k}" ${f.material===m.k?'selected':''}>${m.n}</option>`).join('')}
        </select>
      </div>
      <div class="field">

        <div class="stepper" role="group" aria-labelledby="qtyLbl"><button type="button" data-qty="-1" aria-label="Uno menos">−</button><output id="qtyOut" aria-live="polite">${f.qty}</output><button type="button" data-qty="1" aria-label="Uno más">+</button></div>

      <span class="lbl">Estilo que te gusta</span>
      <div class="checks" role="radiogroup" aria-label="Estilo">${STYLES.map(s=>`<button type="button" class="chip ${style===s.k?'on':''}" role="radio" aria-checked="${style===s.k}" data-fstyle="${s.k}">${s.n}</button>`).join('')}</div>

      <span class="lbl">Tiempo disponible</span>

      <span class="lbl">Materiales y herramientas que ya tienes</span>

function viewLoading(){
  return `<div class="loader" aria-live="polite"><svg class="spin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#E2D9C7" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#2F5D45" stroke-width="6" stroke-linecap="round" stroke-dasharray="50 200"/></svg><h2>Buscando ideas…</h2><p class="muted">Comparando tu ${esc(S.query?S.query.obj.toLowerCase():'objeto')} con el catálogo de ejemplo</p></div>`;
}

function viewResults(){
  if(!S.query) return `<div class="empty">${emptyArt()}<h2>Aún no has buscado nada</h2><p class="muted">Cuéntanos qué objeto tienes para ver ideas.</p><button class="btn btn-primary" data-go="crear">Empezar</button></div>`;
  const q=S.query, {mat,list}=match(q);
  const filtered = list.filter(x=>applyFilters([x.p],S.rfilters).length);
  const head = `<section style="padding-bottom:0">
    <p class="eyebrow">Ideas para ti</p>
    <h1 style="margin:8px 0 8px;font-size:clamp(1.6rem,5vw,2.3rem)">${esc(q.obj)}</h1>
    <div class="badges">${mat?`<span class="badge ok">${MATN[mat]}</span>`:''}<span class="badge">${q.qty} ${q.qty===1?'unidad':'unidades'}</span><span class="badge">${styleName(q.style)}</span><span class="badge">Hasta ${fmtMin(q.time)}</span><button class="badge" style="border:0;cursor:pointer;background:var(--accent-soft);color:#8a3415" data-go="crear">Editar búsqueda</button></div>
  </section>`;
  if(!list.length) return head+`<div class="empty">${emptyArt()}<h2>No encontramos ideas para eso… todavía</h2><p class="muted" style="max-width:44ch">El catálogo de la demo es pequeño. Prueba eligiendo el material a mano o con uno de estos objetos:</p><div class="examples" style="justify-content:center">${EXAMPLES.map((e,i)=>`<button class="chip ex" data-example="${i}">${esc(e.obj)}</button>`).join('')}</div></div>`;
  return head + `<section style="padding-top:8px">
    ${filterBar('rfilters')}
    <div class="resbar"><span class="muted small"><b style="color:var(--ink)">${filtered.length}</b> de ${list.length} ideas${activeCount(S.rfilters)?' con los filtros activos':''}</span>${activeCount(S.rfilters)?`<button class="linkbtn small" data-clearfilters="rfilters">Quitar filtros</button>`:''}</div>
    ${filtered.length?`<div class="grid g3">${filtered.map(({p,reasons})=>card(p, `${reasons.length?`<div class="reasons">${reasons.map(r=>`<span class="reason">${I.check} ${r}</span>`).join('')}</div>`:''}<p class="small" style="color:${q.qty>=p.needs?'var(--moss)':'#a43e1b'};font-weight:600">${q.qty>=p.needs?(p.needs>1?`Te llega: necesitas ${p.needs}`:(Math.floor(q.qty/p.needs)>1?`Te da para ${Math.floor(q.qty/p.needs)}`:'Te llega con 1')):`Necesitas ${p.needs}, tienes ${q.qty}`}</p>`)).join('')}</div>`
    :`<div class="empty">${emptyArt()}<h3>Ningún proyecto cumple estos filtros</h3><button class="btn btn-ghost" data-clearfilters="rfilters">Quitar filtros</button></div>`}
  </section>`;
}

function viewExplore(){
  const e=S.explore, q=norm(e.q);
  let items = P.filter(p=>(!e.cat||p.mat===e.cat)&&(!q||norm(p.t+' '+p.d+' '+p.kw.join(' ')+' '+MATN[p.mat]+' '+p.use).includes(q)));
  items = applyFilters(items,S.efilters);
  return `<section>
    <p class="eyebrow">Explorar</p>
    <h1 style="margin:8px 0 14px;font-size:clamp(1.7rem,5vw,2.4rem)">Busca por objeto o material</h1>
    <div style="position:relative"><input class="input" id="searchInput" type="search" placeholder="Buscar: botella, lámpara, plantas…" value="${esc(e.q)}" aria-label="Buscar proyectos" style="padding-left:44px"><span style="position:absolute;left:14px;top:14px;color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span></div>
    <h3 style="margin:20px 0 10px">Objetos frecuentes</h3>
    <div class="cats">${MATERIALS.map(m=>`<button class="cat ${e.cat===m.k?'on':''}" data-cat="${m.k}" aria-pressed="${e.cat===m.k}">${CAT_ICONS[m.k]}${m.n}</button>`).join('')}</div>
    ${filterBar('efilters')}
    <div class="resbar"><span class="muted small"><b style="color:var(--ink)">${items.length}</b> proyectos</span>${(e.q||e.cat||activeCount(S.efilters))?`<button class="linkbtn small" data-action="clearExplore">Limpiar búsqueda y filtros</button>`:''}</div>
    ${items.length?`<div class="grid g3">${items.map(p=>card(p)).join('')}</div>`:`<div class="empty">${emptyArt()}<h3>Sin resultados para “${esc(e.q)}”</h3><p class="muted">Prueba con otra palabra o crea una búsqueda guiada.</p><div class="row" style="justify-content:center"><button class="btn btn-ghost" data-action="clearExplore">Limpiar</button><button class="btn btn-primary" data-go="crear">Búsqueda guiada</button></div></div>`}
  </section>`;
}

function viewDetail(p){
  const fav=S.favs.includes(p.id), done=S.done.includes(p.id);
  if(locked(p)) return `<section><div class="detail-grid"><div class="detail-art">${artFor(p)}<span class="lockveil" style="font-size:1rem">${I.lock} Contenido Premium</span></div><div class="stack"><span class="badge prem">${I.crown} Premium</span><h1 style="font-size:clamp(1.6rem,5vw,2.3rem)">${esc(p.t)}</h1><p class="lead">${esc(p.d)}</p><div class="notice warm">${I.lock}<span>Los pasos, plantillas y planos de este proyecto forman parte del plan Premium de la demo.</span></div><div class="actionbar"><button class="btn btn-dark" data-go="premium">${I.crown} Ver plan Premium</button><button class="btn btn-ghost" data-fav="${p.id}">${fav?'Guardado':'Guardar idea'}</button></div></div></div></section>`;
  const kit = S.query?S.query.kit:S.profile.kit;
  const done_steps = S.steps[p.id]||[];
  const pct = Math.round(done_steps.length/p.s.length*100);
  const objItems=p.m.filter(x=>x.obj), have=p.m.filter(x=>!x.obj&&!x.extra&&(!x.k||kit.includes(x.k))), need=p.m.filter(x=>!x.obj&&(x.extra||(x.k&&!kit.includes(x.k))));
  const qty = S.query && S.query.material!==undefined ? S.query.qty : null;
  const li=(x,cls,tag)=>`<li class="${cls}"><span class="dot">${cls==='need'?I.plus:I.check}</span>${esc(x.n)}<span class="tag">${tag}</span></li>`;
  return `<section>
  <div class="detail-grid">
    <div class="detail-aside stack">
      <div class="detail-art" id="detailArt">${artFor(p)}<span class="tagline">${p.premium?`<span class="badge prem">${I.crown} Premium</span>`:''}${done?`<span class="badge done">${I.check} Terminado</span>`:''}</span></div>
      <p class="small muted">Ilustración de referencia. El resultado real depende de tu objeto.</p>
      <div class="facts"><div class="fact"><span>Dificultad</span><b>${p.diff}</b></div><div class="fact"><span>Tiempo</span><b>${fmtMin(p.min)}</b></div><div class="fact"><span>Necesitas</span><b>${p.needs} ud.</b></div></div>
    </div>
    <div class="stack">
      <div class="badges"><span class="badge">${MATN[p.mat]}</span><span class="badge">${styleName(p.style)}</span><span class="badge">${p.use}</span></div>
      <h1 style="font-size:clamp(1.7rem,5vw,2.5rem)">${esc(p.t)}</h1>
      <p class="lead">${esc(p.d)}</p>
      ${qty!==null&&S.query&&S.query.mat===p.mat?`<div class="qtybox">${qty>=p.needs?`Con tus ${qty} ${qty===1?'unidad':'unidades'} ${p.needs===1&&qty>1?`puedes hacer <b>${qty}</b>, por ejemplo para regalar.`:'tienes suficiente.'}`:`Necesitas <b>${p.needs}</b> y tienes ${qty}. Puedes pedir a amistades o vecinos que te guarden los que les sobren.`}</div>`:''}
      <div class="actionbar">
        <button class="btn ${fav?'btn-dark':'btn-ghost'}" data-fav="${p.id}" aria-pressed="${fav}">${I.heart} ${fav?'Guardado':'Guardar'}</button>
        <button class="btn btn-primary" data-done="${p.id}" ${done?'disabled':''}>${I.check} ${done?'Terminado':'Marcar como terminado'}</button>
      </div>
      <h2 style="margin-top:22px;font-size:1.35rem">Materiales</h2>
      ${need.length?`<div class="notice warm">${I.info}<span>Esta idea necesita <b>${need.length} ${need.length===1?'material adicional':'materiales adicionales'}</b> que no tienes marcados.</span></div>`:`<div class="notice">${I.check}<span>Tienes todo lo necesario según tus materiales.</span></div>`}
      <ul class="mlist">
        ${objItems.map(x=>li(x,'have','Tu objeto')).join('')}
        ${have.map(x=>li(x,'have','Ya lo tienes')).join('')}
        ${need.map(x=>li(x,'need','Conseguir')).join('')}

/* ================= ACCIONES ================= */
let toastT;
function toast(msg,undo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${msg}</span>${undo?'<button data-undo>Deshacer</button>':''}`;
  t.classList.add('show'); clearTimeout(toastT);
  t._undo=undo; toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
document.getElementById('toast').addEventListener('click',e=>{if(e.target.matches('[data-undo]')){const t=e.currentTarget;t._undo&&t._undo();t.classList.remove('show');}});

function toggleFav(id,btn){
  const i=S.favs.indexOf(id);
  if(i>=0){S.favs.splice(i,1);save();render();toast('Quitado de guardados',()=>{S.favs.push(id);save();render();});}
  else{S.favs.push(id);save();render();const b=document.querySelector(`.fav[data-fav="${id}"]`);b&&b.classList.add('pop');toast('Guardado en tus proyectos');}
}
function markDone(id){
  const p=BY[id]; if(!p||S.done.includes(id))return;
  S.done.push(id); S.steps[id]=p.s.map((_,i)=>i); save(); render(); celebrate(p);
}
function celebrate(p){
  const m=document.getElementById('modal');
  const colors=['#C8562E','#2F5D45','#E8B04B','#7fb1c9','#E9B9A6'];
  const conf=Array.from({length:40},(_,i)=>`<i style="left:${Math.random()*100}%;background:${colors[i%5]};animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');
  m.innerHTML=`<div class="sheet"><div class="confetti">${conf}</div>
    <svg class="medal" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#E2ECE3"/><circle cx="48" cy="48" r="32" fill="#2F5D45"/><path d="M34 49l9 9 19-20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 id="modalTitle">¡Lo has conseguido!</h2>
    <p class="muted" style="margin:8px 0 6px">Has dado una segunda vida a tu ${esc(MATN[p.mat].toLowerCase())} con <b style="color:var(--ink)">${esc(p.t)}</b>.</p>
    <p class="small" style="color:var(--moss);font-weight:600">≈ ${fmtKg(p.g)} de residuo evitado · estimación de ejemplo</p>
    <div class="row" style="margin-top:18px;justify-content:center"><button class="btn btn-primary" data-modal="impacto">Ver mi impacto</button><button class="btn btn-ghost" data-modal="close">Seguir creando</button></div></div>`;
  m.classList.add('show');
  setTimeout(()=>m.querySelector('[data-modal="impacto"]').focus(),50);
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const b=e.target.closest('[data-modal]'); if(!b)return;
  closeModal(); if(b.dataset.modal==='impacto') go('impacto');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function surprise(){
  const pool=P.filter(p=>!locked(p)&&('proyecto-'+p.id)!==route);
  const p=pool[Math.floor(Math.random()*pool.length)];
  go('proyecto-'+p.id);
  const a=document.getElementById('detailArt'); a&&a.classList.add('shuffle');
  toast('Idea sorpresa: '+esc(p.t));
}
function runSearch(q){
  S.query={...q, mat: q.material==='auto'?detectMaterial(q.obj):q.material};
  S.rfilters={style:'',diff:'',time:'',use:''};
  go('cargando');
  setTimeout(()=>{ if(route==='cargando'){ route='resultados'; try{history.replaceState(null,'','#resultados')}catch(e){} render(); window.scrollTo(0,0);} },900);
}
function exampleQuery(i){
  const e=EXAMPLES[i];
  S.form={obj:e.obj,material:e.material,qty:e.qty,style:e.style,time:S.profile.time,kit:[...S.profile.kit]};
  runSearch({obj:e.obj,material:e.material,qty:e.qty,style:e.style,time:S.profile.time,kit:[...S.profile.kit]});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.open){go('proyecto-'+d.open);return;}
  if(d.fav){e.stopPropagation();toggleFav(d.fav,t);return;}
  if(d.done){markDone(d.done);return;}
  if(d.example!==undefined){exampleQuery(+d.example);return;}
  if(d.cat){ if(route==='explorar'){S.explore.cat = S.explore.cat===d.cat?'':d.cat;render();} else {S.explore={q:'',cat:d.cat};S.efilters={style:'',diff:'',time:'',use:''};go('explorar');} return;}
  if(d.filter){S[d.filter][d.key]=d.val;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.clearfilters){S[d.clearfilters]={style:'',diff:'',time:'',use:''};render();return;}
  if(d.step){
    const arr=S.steps[d.step]=S.steps[d.step]||[]; const i=+d.i; const k=arr.indexOf(i);
    k>=0?arr.splice(k,1):arr.push(i); save();
    const y=window.scrollY; render(); window.scrollTo(0,y);
    const p=BY[d.step]; if(arr.length===p.s.length && !S.done.includes(p.id)) toast('¡Todos los pasos hechos! Marca el proyecto como terminado.');
    return;
  }
  // formulario
  if(d.qty){syncForm();S.form.qty=Math.max(1,Math.min(99,S.form.qty+(+d.qty)));document.getElementById('qtyOut').textContent=S.form.qty;return;}
  if(d.fstyle){syncForm();S.form.style=d.fstyle;rerenderKeep();return;}
  if(d.ftime){syncForm();S.form.time=+d.ftime;rerenderKeep();return;}
  if(d.fkit){syncForm();const k=S.form.kit||[...S.profile.kit];const i=k.indexOf(d.fkit);i>=0?k.splice(i,1):k.push(d.fkit);S.form.kit=k;rerenderKeep();return;}
  if(d.fillexample!==undefined){const ex=EXAMPLES[+d.fillexample];S.form={...S.form,obj:ex.obj,material:ex.material,qty:ex.qty,style:ex.style};rerenderKeep();toast('Ejemplo cargado: pulsa “Ver ideas”');return;}
  // perfil
  if(d.pstyle){syncProfileName();S.profile.style=d.pstyle;save();rerenderKeep();toast('Estilo favorito: '+styleName(d.pstyle));return;}
  if(d.ptime){syncProfileName();S.profile.time=+d.ptime;save();rerenderKeep();return;}
  if(d.pkit){syncProfileName();const k=S.profile.kit;const i=k.indexOf(d.pkit);i>=0?k.splice(i,1):k.push(d.pkit);save();rerenderKeep();return;}
  switch(d.action){
    case 'back': back(); break;
    case 'surprise': surprise(); break;
    case 'clearForm': S.form={obj:'',material:'auto',qty:1,style:null,time:null,kit:null}; render(); break;
    case 'clearExplore': S.explore={q:'',cat:''}; S.efilters={style:'',diff:'',time:'',use:''}; render(); break;
    case 'saveProfile': syncProfileName(); save(); render(); toast('Preferencias guardadas'); break;
    case 'toPremium': S.premium=true; save(); render(); toast('Premium activado en la demo · sin pagos reales'); break;
    case 'toFree': S.premium=false; save(); render(); toast('Has vuelto al plan gratuito'); break;
    case 'reset': {
      const prev=JSON.stringify({profile:S.profile,favs:S.favs,done:S.done,steps:S.steps,premium:S.premium});
      const fresh=structuredClone(DEFAULT); Object.assign(S,fresh); save(); stack=[]; go('inicio',{replace:true,force:true});
      toast('Demo reiniciada',()=>{Object.assign(S,JSON.parse(prev));save();render();}); break;
    }
  }
});
function rerenderKeep(){const y=window.scrollY;render();window.scrollTo(0,y);}
function syncForm(){
  const o=document.getElementById('obj'), m=document.getElementById('material');
  if(o) S.form.obj=o.value; if(m) S.form.material=m.value;
}
function syncProfileName(){const n=document.getElementById('pname'); if(n) S.profile.name=n.value.trim()||'Invitado';}

document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){S.explore.q=e.target.value;S._focusSearch=true;render();}
  if(e.target.id==='obj'){
    S.form.obj=e.target.value; e.target.classList.remove('err'); document.getElementById('objErr').hidden=true;
    const det = document.getElementById('material').value==='auto'?detectMaterial(e.target.value):null;
    document.getElementById('objHint').innerHTML = det?`Material detectado: <b>${MATN[det]}</b>`:(e.target.value.trim()?'No reconocemos el material: elígelo en la lista.':'Escribe el objeto y detectaremos el material, o elígelo abajo.');
  }
});
document.addEventListener('change',e=>{if(e.target.id==='material'){syncForm();}});
document.addEventListener('submit',e=>{
  if(e.target.id!=='createForm')return;
  e.preventDefault(); syncForm();
  const f=S.form;
  if(!f.obj.trim()){const o=document.getElementById('obj');o.classList.add('err');document.getElementById('objErr').hidden=false;o.focus();return;}
  if(f.material==='auto' && !detectMaterial(f.obj)){
    const m=document.getElementById('material'); m.focus();
    document.getElementById('objHint').innerHTML='<b style="color:#a43e1b">No reconocemos el material.</b> Elígelo en la lista para continuar.';
    return;
  }
  runSearch({obj:f.obj.trim(),material:f.material,qty:f.qty,style:f.style||S.profile.style,time:f.time||S.profile.time,kit:[...(f.kit||S.profile.kit)]});
});

/* ================= INICIO ================= */
const h=location.hash.slice(1);
route = (h && h!=='cargando' && h!=='resultados') ? h : 'inicio';
render();
})();
</script>
